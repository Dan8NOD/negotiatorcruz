name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lead function has no runtime dependencies; this only installs the
      # dev tooling the tests need.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run unit, static, SEO, config and pricing tests
        run: npm test
        env:
          # Arms the Practice Lab price-drift guard, which compares every local
          # amount against what Stripe will actually charge. Without the secret
          # that one test skips and the rest still run, so this is safe to leave
          # unset -- but unset means a price edited in the Stripe dashboard
          # stops being caught, which is exactly how the chat-token product came
          # to advertise $15 while pinned to an archived $3 price.
          #
          # Use a RESTRICTED key, not the account secret key. The test only ever
          # issues GET /v1/prices, so it needs read access to Products and
          # nothing else. Stripe: Developers -> API keys -> Create restricted key.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Coverage for api/lead.js
        run: npm run test:coverage

      # The Swift token meter asserts against fixtures exported from
      # mixmatch/config/tokens.js. Stale fixtures would let the iOS port agree
      # with a price the web app no longer charges -- which is a money bug, not
      # a test-hygiene one. Regenerating and diffing is what makes a deliberate
      # price change show up as a decision about the app rather than silence.
      - name: Token fixtures are current
        run: |
          npm run mixmatch:fixtures
          git diff --exit-code --stat mixmatch/swift/Tests/MixMatchKitTests/Fixtures \
            || { echo "::error::Token config changed. Commit the regenerated fixtures and re-check the Swift port."; exit 1; }

      # timer-tab.inline.html is the block that actually gets pasted into
      # MixMatch.html, with the engine inlined because a single-file app cannot
      # import one. Regenerating and diffing is what stops the pasteable copy
      # from quietly falling behind the engine the tests are run against.
      - name: Timer tab drop-in is current
        run: |
          npm run mixmatch:timer
          git diff --exit-code --stat \
            mixmatch/web/timer-tab.inline.html \
            mixmatch/ios/MixMatch.swiftpm/Resources/index.html \
            || { echo "::error::The Timer tab changed. Commit the regenerated drop-in and app page."; exit 1; }

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # rocketman/ is a side project staged in this repository (see
  # rocketman/README.md). It gets its own job on purpose: the site's `npm test`
  # and `npm run test:e2e` must stay exactly what they were, so a bug in a game
  # can never turn negotiatorcruz.com's build red.
  rocketman:
    name: Rocketman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Simulation tests
        run: npm run test:rocketman

      # The Swift port asserts against fixtures exported from this engine, so
      # stale fixtures would let the port "pass" against a version of the game
      # that no longer exists. Regenerating and diffing is the only way to make
      # a deliberate behaviour change in engine/ show up as a decision about
      # the port rather than as silence.
      - name: Conformance fixtures are current
        run: |
          npm run rocketman:fixtures
          git diff --exit-code --stat rocketman/swift/Tests/RocketmanKitTests/Fixtures \
            || { echo "::error::Engine behaviour changed. Commit the regenerated fixtures and re-check the Swift port."; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:rocketman:e2e

  # The Fire OS build (rocketman/android). Worth a job of its own because its
  # failure mode is silent: the shell compiles whether or not the game was
  # copied into it, so a broken asset sync ships an APK that installs, launches,
  # and shows a black screen. The APK is unzipped below rather than trusted.
  rocketman-android:
    name: Rocketman (Fire OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build the Fire tablet APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: rocketman/android

      # The whole game, or the build is a lie.
      - name: The APK actually contains the game
        run: |
          APK=rocketman/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/game/web/rocketman.html' \
            || { echo "::error::The page is missing from the APK."; exit 1; }
          engine=$(unzip -l "$APK" | grep -c 'assets/game/engine/.*\.js')
          on_disk=$(find rocketman/engine -name '*.js' | wc -l)
          [ "$engine" -eq "$on_disk" ] \
            || { echo "::error::APK has $engine engine modules, repository has $on_disk."; exit 1; }
          echo "Packaged $engine engine modules and the page."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rocketman-fire-apk
          path: rocketman/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # The Swift port of the engine (rocketman/swift). Runs in the official Swift
  # container so it needs no Mac: RocketmanKit is deliberately free of UIKit and
  # SpriteKit, which is what lets the conformance suite run on every push rather
  # than only when someone opens Xcode.
  rocketman-swift:
    name: Rocketman (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Conformance tests
        run: swift test --package-path rocketman/swift

  # The Timer tab in a real browser. The engine's unit tests cannot see the
  # page, and the first bug this tab shipped was pure CSS — `display:flex`
  # beating the `hidden` attribute, "Round over" over a live game, every unit
  # test green. This job tests both the module source and the generated page
  # the iPad app ships, at iPad viewport, including one full played round.
  mixmatch-browser:
    name: Mix & Match (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:mixmatch:e2e

  # The Swift token meter (mixmatch/swift). Runs in the official Swift
  # container so it needs no Mac: MixMatchKit is deliberately free of UIKit and
  # SwiftUI, which is what lets the numbers deciding what a customer is charged
  # be verified on every push rather than only when someone opens Xcode.
  mixmatch-swift:
    name: Mix & Match (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Conformance tests
        run: swift test --package-path mixmatch/swift
