name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lead function has no runtime dependencies; this only installs the
      # dev tooling the tests need.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run unit, static, SEO, config and pricing tests
        run: npm test
        env:
          # Arms the Practice Lab price-drift guard, which compares every local
          # amount against what Stripe will actually charge. Without the secret
          # that one test skips and the rest still run, so this is safe to leave
          # unset -- but unset means a price edited in the Stripe dashboard
          # stops being caught, which is exactly how the chat-token product came
          # to advertise $15 while pinned to an archived $3 price.
          #
          # Use a RESTRICTED key, not the account secret key. The test only ever
          # issues GET /v1/prices, so it needs read access to Products and
          # nothing else. Stripe: Developers -> API keys -> Create restricted key.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Coverage for api/lead.js
        run: npm run test:coverage

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # rocketman/ is a side project staged in this repository (see
  # rocketman/README.md). It gets its own job on purpose: the site's `npm test`
  # and `npm run test:e2e` must stay exactly what they were, so a bug in a game
  # can never turn negotiatorcruz.com's build red.
  rocketman:
    name: Rocketman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Simulation tests
        run: npm run test:rocketman

      # The Swift port asserts against fixtures exported from this engine, so
      # stale fixtures would let the port "pass" against a version of the game
      # that no longer exists. Regenerating and diffing is the only way to make
      # a deliberate behaviour change in engine/ show up as a decision about
      # the port rather than as silence.
      - name: Conformance fixtures are current
        run: |
          npm run rocketman:fixtures
          git diff --exit-code --stat rocketman/swift/Tests/RocketmanKitTests/Fixtures \
            || { echo "::error::Engine behaviour changed. Commit the regenerated fixtures and re-check the Swift port."; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:rocketman:e2e

  # The Swift port of the engine (rocketman/swift). Runs in the official Swift
  # container so it needs no Mac: RocketmanKit is deliberately free of UIKit and
  # SpriteKit, which is what lets the conformance suite run on every push rather
  # than only when someone opens Xcode.
  rocketman-swift:
    name: Rocketman (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Conformance tests
        run: swift test --package-path rocketman/swift
