name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lead function has no runtime dependencies; this only installs the
      # dev tooling the tests need.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run unit, static, SEO, config and pricing tests
        run: npm test
        env:
          # Arms the Practice Lab price-drift guard, which compares every local
          # amount against what Stripe will actually charge. Without the secret
          # that one test skips and the rest still run, so this is safe to leave
          # unset -- but unset means a price edited in the Stripe dashboard
          # stops being caught, which is exactly how the chat-token product came
          # to advertise $15 while pinned to an archived $3 price.
          #
          # Use a RESTRICTED key, not the account secret key. The test only ever
          # issues GET /v1/prices, so it needs read access to Products and
          # nothing else. Stripe: Developers -> API keys -> Create restricted key.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Coverage for api/lead.js
        run: npm run test:coverage

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # rocketman/ is a side project staged in this repository (see
  # rocketman/README.md). It gets its own job on purpose: the site's `npm test`
  # and `npm run test:e2e` must stay exactly what they were, so a bug in a game
  # can never turn negotiatorcruz.com's build red.
  rocketman:
    name: Rocketman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Simulation tests
        run: npm run test:rocketman

      # The Swift port asserts against fixtures exported from this engine, so
      # stale fixtures would let the port "pass" against a version of the game
      # that no longer exists. Regenerating and diffing is the only way to make
      # a deliberate behaviour change in engine/ show up as a decision about
      # the port rather than as silence.
      - name: Conformance fixtures are current
        run: |
          npm run rocketman:fixtures
          git diff --exit-code --stat rocketman/swift/Tests/RocketmanKitTests/Fixtures \
            || { echo "::error::Engine behaviour changed. Commit the regenerated fixtures and re-check the Swift port."; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:rocketman:e2e

  # The Fire OS build (rocketman/android). Worth a job of its own because its
  # failure mode is silent: the shell compiles whether or not the game was
  # copied into it, so a broken asset sync ships an APK that installs, launches,
  # and shows a black screen. The APK is unzipped below rather than trusted.
  rocketman-android:
    name: Rocketman (Fire OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build the Fire tablet APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: rocketman/android

      # The whole game, or the build is a lie.
      - name: The APK actually contains the game
        run: |
          APK=rocketman/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/game/web/rocketman.html' \
            || { echo "::error::The page is missing from the APK."; exit 1; }
          engine=$(unzip -l "$APK" | grep -c 'assets/game/engine/.*\.js')
          on_disk=$(find rocketman/engine -name '*.js' | wc -l)
          [ "$engine" -eq "$on_disk" ] \
            || { echo "::error::APK has $engine engine modules, repository has $on_disk."; exit 1; }
          echo "Packaged $engine engine modules and the page."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rocketman-fire-apk
          path: rocketman/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # The four books (book/, guide/, drillbook/, everyday/). Its own job for the
  # same reason rocketman has one: the site's `npm test` must stay exactly
  # what it is, so a manuscript can never turn negotiatorcruz.com's build red.
  #
  # Worth running at all because the failure mode here is silence. The manual
  # shipped for weeks without its front matter or any of its three appendices
  # and every build stayed green, since a renderer that never opens a file
  # cannot complain about it. shipcheck asks the question the builds could not.
  books:
    name: Books
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every book script is pure standard library on purpose, so there is
      # nothing to install and this job cannot break on a dependency.
      - name: Build all four books
        run: |
          python3 book/tools/build.py
          python3 book/tools/makebook.py
          python3 guide/tools/makeguide.py
          python3 drillbook/tools/makedrillbook.py
          python3 everyday/tools/makeeveryday.py
          python3 book/tools/makecards.py
          python3 book/tools/makeepub.py
          python3 book/tools/makeepub2.py guide
          python3 book/tools/makeepub2.py drillbook
          python3 book/tools/makeepub2.py everyday

      - name: Every source file reaches the finished book
        run: python3 book/tools/shipcheck.py

      # Dan's standing rule. The pass is not applied here, only asked whether
      # it would change anything, so a manuscript cannot be rewritten by CI.
      - name: No dashes, Chicago plain-speech
        run: |
          python3 book/tools/voicepass.py --dry \
            $(git ls-files 'book/*.md' 'book/**/*.md' 'guide/*.md' \
                           'drillbook/**/*.md' 'everyday/*.md')

      # Scripted lines come from the 544 shipped lines. The manual is exempt
      # for now: its Part V has 41 authored lines that are known, listed in
      # book/PART-V-LINES.md, and waiting on Dan rather than on a fix.
      - name: Scripted lines come from the catalog
        run: |
          python3 book/tools/verifylines.py guide/ch*.md
          python3 book/tools/verifylines.py everyday/ch*.md

  # The Swift port of the engine (rocketman/swift). Runs in the official Swift
  # container so it needs no Mac: RocketmanKit is deliberately free of UIKit and
  # SpriteKit, which is what lets the conformance suite run on every push rather
  # than only when someone opens Xcode.
  rocketman-swift:
    name: Rocketman (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Conformance tests
        run: swift test --package-path rocketman/swift
