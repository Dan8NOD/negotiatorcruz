org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# No native code and no ABI-specific dependencies, so one universal APK covers
# every Fire tablet — ARM and the x86 emulator image alike. This matters for
# the Amazon Appstore, which takes an APK rather than an app bundle and does
# not split by ABI on your behalf.
android.enableR8.fullMode=true
