<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mix &amp; Match — Timer</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#241F19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MM Timer">
<style>
  html,body{margin:0;background:#241F19;color:#F6EFE2;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  .page{max-width:640px;margin:0 auto;padding:20px 14px 40px}
  .page > p{font-size:12.5px;line-height:1.6;color:#9a9186;text-align:center;margin:22px 0 0}
</style>
</head>
<body>
<div class="page">

<!-- ══════════════════════════════════════════════════════════════════════════
     MM-TIMER-TAB:BEGIN

     The Timer tab, as a drop-in.

     MixMatch.html is a single-file app, so this is written the same way the
     cross-promo mini-ad is: one <section>, one <style>, one <script>, every
     class prefixed `mmt-`, no external files and no assets of any kind. Paste
     the whole block between these markers into MixMatch.html wherever the tab
     body goes.

     Two integration points, and no others:

       1. This section renders itself. It does not start anything on load.
       2. If MixMatch's tab switcher can tell it when the tab is shown or
          hidden, call window.MMTimerTab.onShow() / .onHide(). onHide pauses a
          running round, so switching to the Tool Deck mid-drill does not
          silently burn the clock. Skip it and everything still works; you just
          lose the auto-pause.

     Do NOT hand-edit the inlined engine in timer-tab.inline.html. It is
     generated from timer-engine.js by `npm run mixmatch:timer`, and CI fails
     if the two disagree.
     ══════════════════════════════════════════════════════════════════════ -->
<section class="mmt" id="mmt-root" aria-labelledby="mmt-title">
  <h2 class="mmt-title" id="mmt-title">⏱️ Timer</h2>
  <p class="mmt-lede">Set the round. Run it straight, or run it with something to do while you wait.</p>

  <div class="mmt-modes" role="radiogroup" aria-label="Timer mode">
    <button type="button" class="mmt-mode on" data-mode="timer" role="radio" aria-checked="true">Timer</button>
    <button type="button" class="mmt-mode" data-mode="arcade" role="radio" aria-checked="false">Arcade</button>
  </div>

  <div class="mmt-presets" id="mmt-presets" role="radiogroup" aria-label="Round length"></div>
  <p class="mmt-blurb" id="mmt-blurb"></p>

  <div class="mmt-stage">
    <div class="mmt-clockwrap">
      <span class="mmt-clock" id="mmt-clock" role="timer" aria-live="off">3:00</span>
      <div class="mmt-bar"><i id="mmt-bar"></i></div>
    </div>

    <div class="mmt-field" id="mmt-field" hidden>
      <canvas id="mmt-canvas" aria-label="Arcade: move to shoot down pressure tactics, and let genuine offers land."></canvas>
      <div class="mmt-hud">
        <span id="mmt-score">0</span>
        <span id="mmt-missed" aria-label="Pressure tactics that got through">0 through</span>
      </div>
      <div class="mmt-over" id="mmt-over" hidden>
        <strong id="mmt-over-head">Round over</strong>
        <span id="mmt-over-body"></span>
        <button type="button" class="mmt-btn" id="mmt-again">Go again</button>
      </div>
    </div>
  </div>

  <div class="mmt-controls">
    <button type="button" class="mmt-btn primary" id="mmt-go">Start</button>
    <button type="button" class="mmt-btn" id="mmt-reset">Reset</button>
    <button type="button" class="mmt-btn quiet" id="mmt-sound" aria-pressed="true" title="End-of-round chime">🔔</button>
  </div>

  <p class="mmt-foot" id="mmt-foot"></p>
</section>

<style>
.mmt{--ink:#241F19;--cream:#FFFDF7;--paper:#F6EFE2;--rule:rgba(38,30,20,.12);
  --dim:#6B6154;--brand:#9C5122;--gold:#c9a84c;--red:#B0413E;--green:#2E7D32;
  max-width:560px;margin:0 auto;padding:18px 16px 20px;border-radius:16px;
  background:linear-gradient(180deg,#F6EFE2 0%,#EDE4D2 100%);color:var(--ink);
  border:1px solid rgba(251,191,36,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.mmt-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.mmt-lede{margin:4px 0 14px;font-size:12.5px;line-height:1.5;color:var(--dim)}

.mmt-modes{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:rgba(38,30,20,.07)}
.mmt-mode{appearance:none;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;
  padding:6px 14px;border-radius:8px;color:var(--dim);background:transparent}
.mmt-mode.on{background:var(--cream);color:var(--ink);box-shadow:0 1px 3px rgba(90,74,50,.22)}

.mmt-presets{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mmt-preset{appearance:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:999px;color:var(--dim);background:var(--cream);
  border:1px solid var(--rule)}
.mmt-preset.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mmt-blurb{margin:8px 0 0;font-size:11.5px;color:var(--dim);min-height:1.2em}

.mmt-stage{margin:14px 0 0}
.mmt-clockwrap{text-align:center}
.mmt-clock{display:block;font-size:clamp(46px,17vw,72px);font-weight:800;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mmt-clock.low{color:var(--red)}
.mmt-bar{height:5px;border-radius:999px;background:rgba(38,30,20,.12);overflow:hidden;margin:12px 0 0}
.mmt-bar > i{display:block;height:100%;width:100%;border-radius:999px;background:var(--brand)}
.mmt-bar.low > i{background:var(--red)}

.mmt-field{position:relative;margin:14px 0 0;border-radius:12px;overflow:hidden;
  background:#1B1712;border:1px solid rgba(38,30,20,.25)}
.mmt-field canvas{display:block;width:100%;height:auto;touch-action:none}
.mmt-hud{position:absolute;inset:8px 10px auto 10px;display:flex;justify-content:space-between;
  font-size:13px;font-weight:800;color:#F6EFE2;text-shadow:0 1px 3px rgba(0,0,0,.7);
  pointer-events:none;font-variant-numeric:tabular-nums}
.mmt-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:16px;
  background:rgba(27,23,18,.88);color:#F6EFE2}
/* An author `display` beats the UA stylesheet's [hidden]{display:none}, so the
   end-of-round card sat over a live game until this rule was added. Blanket
   rather than targeted: the same trap is waiting for the next element here
   that gets both a display and a hidden attribute. */
.mmt [hidden]{display:none}
.mmt-over strong{font-size:19px}
.mmt-over span{font-size:13px;color:#c8bfae;max-width:32ch;line-height:1.5}

.mmt-controls{display:flex;gap:8px;margin:14px 0 0}
.mmt-btn{appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:800;
  padding:11px 18px;border-radius:10px;border:1px solid var(--rule);
  background:var(--cream);color:var(--ink)}
.mmt-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;flex:1}
.mmt-btn.quiet{padding:11px 13px}
.mmt-btn[aria-pressed="false"]{opacity:.45}
.mmt-btn:disabled{opacity:.4;cursor:default}

.mmt-foot{margin:12px 0 0;font-size:11px;line-height:1.5;color:var(--dim);text-align:center}

@media(prefers-reduced-motion:reduce){.mmt-bar > i{transition:none}}
</style>

<script type="module">
import {
  ROUND_PRESETS, DEFAULT_PRESET, FIELD,
  presetById, createSession, start, pause, resume, reset, update, aimAt, setFiring,
  formatClock, snapshot,
} from './timer-engine.js';

(function () {
  const root = document.getElementById('mmt-root');
  if (!root) return;
  const $ = (id) => document.getElementById(id);

  const STORE = 'mm.timer.v1';
  const el = {
    clock: $('mmt-clock'), bar: $('mmt-bar'), barWrap: $('mmt-bar').parentElement,
    presets: $('mmt-presets'), blurb: $('mmt-blurb'), field: $('mmt-field'),
    canvas: $('mmt-canvas'), score: $('mmt-score'), missed: $('mmt-missed'),
    over: $('mmt-over'), overHead: $('mmt-over-head'), overBody: $('mmt-over-body'),
    again: $('mmt-again'), go: $('mmt-go'), reset: $('mmt-reset'),
    sound: $('mmt-sound'), foot: $('mmt-foot'),
  };
  const ctx = el.canvas.getContext('2d');

  const prefs = load();
  let mode = prefs.mode === 'arcade' ? 'arcade' : 'timer';
  let presetId = ROUND_PRESETS.some((p) => p.id === prefs.presetId) ? prefs.presetId : DEFAULT_PRESET;
  let soundOn = prefs.soundOn !== false;
  let session = createSession({ durationMs: presetById(presetId).ms, mode, seed: seed() });
  let raf = 0;
  let chimed = false;

  function seed() { return (Math.random() * 0xffffffff) >>> 0; }

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch { return {}; }
  }
  function save(patch) {
    try {
      localStorage.setItem(STORE, JSON.stringify({ ...load(), ...patch }));
    } catch { /* private browsing: preferences just do not persist */ }
  }

  // ── chrome ───────────────────────────────────────────────────────────────

  ROUND_PRESETS.forEach((preset) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mmt-preset';
    b.dataset.preset = preset.id;
    b.textContent = preset.label;
    b.setAttribute('role', 'radio');
    b.addEventListener('click', () => choosePreset(preset.id));
    el.presets.appendChild(b);
  });

  function choosePreset(id) {
    presetId = id;
    save({ presetId: id });
    rebuild();
  }

  function chooseMode(next) {
    mode = next;
    save({ mode: next });
    rebuild();
  }

  function rebuild() {
    session = createSession({ durationMs: presetById(presetId).ms, mode, seed: seed() });
    chimed = false;
    syncChrome();
    resize();
    draw();
  }

  function syncChrome() {
    root.querySelectorAll('.mmt-mode').forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', String(on));
    });
    root.querySelectorAll('.mmt-preset').forEach((b) => {
      const on = b.dataset.preset === presetId;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', String(on));
    });
    el.blurb.textContent = presetById(presetId).blurb;
    el.field.hidden = mode !== 'arcade';
    el.over.hidden = true;
    el.sound.setAttribute('aria-pressed', String(soundOn));
    el.foot.innerHTML = mode === 'arcade'
      ? 'Hold to fire. Shoot the pressure tactics — lift, and let the genuine offers land. Best: <b>' + best() + '</b>'
      : 'Free, no signup, no account. Nothing here spends tokens.';
    paintControls();
  }

  function paintControls() {
    const s = session.state;
    el.go.textContent = s === 'running' ? 'Pause' : s === 'paused' ? 'Resume' : s === 'done' ? 'Start' : 'Start';
    el.go.disabled = false;
  }

  function best() {
    return Number(load().best || 0);
  }

  // ── controls ─────────────────────────────────────────────────────────────

  root.querySelectorAll('.mmt-mode').forEach((b) =>
    b.addEventListener('click', () => chooseMode(b.dataset.mode)));

  el.go.addEventListener('click', () => {
    if (session.state === 'running') { pause(session); }
    else if (session.state === 'paused') { resume(session, performance.now()); }
    else {
      if (session.state === 'done') rebuild();
      start(session, performance.now());
      armChime();
    }
    paintControls();
    loop();
  });

  el.reset.addEventListener('click', rebuild);
  el.again.addEventListener('click', () => { rebuild(); start(session, performance.now()); armChime(); paintControls(); loop(); });

  el.sound.addEventListener('click', () => {
    soundOn = !soundOn;
    save({ soundOn });
    el.sound.setAttribute('aria-pressed', String(soundOn));
  });

  // Steering and firing are one gesture: your finger is where the tank goes,
  // and holding it down is the trigger. Lift to hold fire. That is the whole
  // control scheme, one finger, no second thumb anywhere near the screen.
  function steer(e) {
    const rect = el.canvas.getBoundingClientRect();
    if (!rect.width) return;
    aimAt(session, (e.clientX - rect.left) / rect.width);
  }
  el.canvas.addEventListener('pointerdown', (e) => {
    el.canvas.setPointerCapture(e.pointerId);
    steer(e);
    setFiring(session, true);
  });
  el.canvas.addEventListener('pointermove', steer);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) =>
    el.canvas.addEventListener(type, () => setFiring(session, false)));

  // Keyboard mirrors it exactly: arrows steer, space is the trigger. Held, not
  // tapped, so the same "stop shooting" move is available without a touchscreen.
  window.addEventListener('keydown', (e) => {
    if (mode !== 'arcade' || el.field.hidden) return;
    if (e.key === 'ArrowLeft') aimAt(session, session.tankX - 0.12);
    else if (e.key === 'ArrowRight') aimAt(session, session.tankX + 0.12);
    else if (e.key === ' ' || e.key === 'Spacebar') {
      // Space still has to activate a focused button, or the keyboard path
      // through Start/Reset breaks the moment the arcade is on screen.
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      setFiring(session, true);
    } else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Spacebar') setFiring(session, false);
  });
  window.addEventListener('blur', () => setFiring(session, false));

  // ── the end-of-round chime ───────────────────────────────────────────────
  // A short oscillator burst rather than an audio file: no asset to host, no
  // request to make, and nothing to fail on a flaky connection.
  let audio = null;
  function armChime() { chimed = false; if (soundOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; } } }
  function chime() {
    if (!soundOn || !audio || chimed) return;
    chimed = true;
    try {
      const t = audio.currentTime;
      [880, 660].forEach((hz, i) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, t + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.18, t + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.16);
        osc.connect(gain).connect(audio.destination);
        osc.start(t + i * 0.18);
        osc.stop(t + i * 0.18 + 0.2);
      });
    } catch { /* audio is a nicety; a round that ends silently still ended */ }
  }

  // ── canvas ───────────────────────────────────────────────────────────────

  function resize() {
    if (el.field.hidden) return;
    const cssWidth = el.canvas.clientWidth || el.field.clientWidth;
    if (!cssWidth) return;
    const cssHeight = Math.round(Math.min(360, Math.max(200, cssWidth * 0.72)));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    el.canvas.style.height = cssHeight + 'px';
    el.canvas.width = Math.round(cssWidth * dpr);
    el.canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { resize(); draw(); });

  function draw() {
    if (el.field.hidden) return;
    const w = el.canvas.clientWidth;
    const h = el.canvas.clientHeight;
    if (!w || !h) return;
    const view = snapshot(session);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1B1712';
    ctx.fillRect(0, 0, w, h);

    const groundY = (FIELD.tankY + 0.06) * h;
    ctx.strokeStyle = 'rgba(246,239,226,.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();

    const blockW = FIELD.blockHalfWidth * 2 * w;
    const blockH = FIELD.blockHeight * h;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.max(8, Math.min(12, blockW * 0.15)) + 'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
    view.blocks.forEach((b) => {
      const x = b.x * w - blockW / 2;
      const y = b.y * h;
      ctx.fillStyle = b.kind === 'offer' ? '#2E7D32' : '#B0413E';
      round(x, y, blockW, blockH, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      ctx.fillText(b.label, b.x * w, y + blockH / 2, blockW - 8);
    });

    ctx.fillStyle = '#c9a84c';
    view.shots.forEach((s) => ctx.fillRect(s.x * w - 1.5, s.y * h - 6, 3, 9));

    // The tank: a hull, a turret and a barrel. Three rectangles, no artwork,
    // which is the entire reason this ships on a static host.
    const tx = view.tankX * w;
    const ty = FIELD.tankY * h;
    const tw = FIELD.tankHalfWidth * 2 * w;
    ctx.fillStyle = view.firing ? '#c9a84c' : '#F6EFE2';
    round(tx - tw / 2, ty, tw, tw * 0.30, 3); ctx.fill();
    round(tx - tw * 0.22, ty - tw * 0.20, tw * 0.44, tw * 0.24, 2); ctx.fill();
    ctx.fillRect(tx - 2, ty - tw * 0.46, 4, tw * 0.28);

    if (view.state === 'idle') {
      ctx.fillStyle = 'rgba(246,239,226,.72)';
      ctx.font = '700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      ctx.fillText('Hold anywhere to aim and fire', w / 2, h * 0.42);
      ctx.font = '600 11.5px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      ctx.fillStyle = 'rgba(246,239,226,.5)';
      ctx.fillText('Lift to hold fire. Green offers are meant to land.', w / 2, h * 0.42 + 19);
    }
  }

  function round(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  // ── the loop ─────────────────────────────────────────────────────────────

  function loop() {
    cancelAnimationFrame(raf);
    const frame = (now) => {
      update(session, now);
      paint();
      if (session.state === 'running') raf = requestAnimationFrame(frame);
      else finish();
    };
    raf = requestAnimationFrame(frame);
  }

  function paint() {
    const view = snapshot(session);
    el.clock.textContent = formatClock(view.remainingMs);
    const low = view.remainingMs <= 10_000 && view.remainingMs > 0;
    el.clock.classList.toggle('low', low);
    el.barWrap.classList.toggle('low', low);
    el.bar.style.width = (view.fractionLeft * 100).toFixed(2) + '%';
    el.score.textContent = String(view.score);
    el.missed.textContent = view.missed + ' through';
    draw();
  }

  function finish() {
    paintControls();
    if (session.state !== 'done') return;
    chime();
    el.clock.setAttribute('aria-live', 'polite');
    if (mode !== 'arcade') return;

    const score = session.score;
    if (score > best()) save({ best: score });
    el.overHead.textContent = 'Round over';
    el.overBody.textContent =
      'Score ' + score + '. ' + session.missed + ' got through. Best ' + best() + '.';
    el.over.hidden = false;
    el.foot.innerHTML = 'Shoot the pressure tactics. Let the genuine offers land. Best: <b>' + best() + '</b>';
  }

  // ── the tab switcher's two hooks ─────────────────────────────────────────

  window.MMTimerTab = {
    onShow() { resize(); draw(); },
    onHide() { if (session.state === 'running') { pause(session); paintControls(); } },
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) window.MMTimerTab.onHide();
  });

  syncChrome();
  resize();
  paint();
})();
</script>
<!-- MM-TIMER-TAB:END -->

<p>
  Standalone preview. In production this block lives inside
  <code>MixMatch.html</code> as the Timer tab.
</p>

</div>
</body>
</html>
