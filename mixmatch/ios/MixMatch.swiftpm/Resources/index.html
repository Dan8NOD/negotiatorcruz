<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mix &amp; Match</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#241F19;color:#F6EFE2;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
    /* A game played by dragging a finger: the OS must not read that as a text
       selection, a callout, or a rubber-band scroll. */
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none}
  .app{min-height:100%;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
            max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  /* App-only: inside MixMatch the tab sits in a column with everything else and
     560px is right. Here it is the whole screen, and an iPad has room for a
     bigger playfield. Overriding from the page rather than from the block keeps
     the pasteable drop-in byte-identical on both. */
  .app .mmt{max-width:min(720px,100%);width:100%}
</style>
</head>
<body>
<div class="app">
<!-- ══════════════════════════════════════════════════════════════════════════
     MM-TIMER-TAB:BEGIN

     The Timer tab, as a drop-in.

     MixMatch.html is a single-file app, so this is written the same way the
     cross-promo mini-ad is: one <section>, one <style>, one <script>, every
     class prefixed `mmt-`, no external files and no assets of any kind. Paste
     the whole block between these markers into MixMatch.html wherever the tab
     body goes.

     Two integration points, and no others:

       1. This section renders itself. It does not start anything on load.
       2. If MixMatch's tab switcher can tell it when the tab is shown or
          hidden, call window.MMTimerTab.onShow() / .onHide(). onHide pauses a
          running round, so switching to the Tool Deck mid-drill does not
          silently burn the clock. Skip it and everything still works; you just
          lose the auto-pause.

     Do NOT hand-edit the inlined engine in timer-tab.inline.html. It is
     generated from timer-engine.js by `npm run mixmatch:timer`, and CI fails
     if the two disagree.
     ══════════════════════════════════════════════════════════════════════ -->
<section class="mmt" id="mmt-root" aria-labelledby="mmt-title">
  <h2 class="mmt-title" id="mmt-title">⏱️ Timer</h2>
  <p class="mmt-lede">Set the round. Run it straight, or run it with something to do while you wait.</p>

  <div class="mmt-modes" role="radiogroup" aria-label="Timer mode">
    <button type="button" class="mmt-mode on" data-mode="timer" role="radio" aria-checked="true">Timer</button>
    <button type="button" class="mmt-mode" data-mode="arcade" role="radio" aria-checked="false">Arcade</button>
  </div>

  <div class="mmt-presets" id="mmt-presets" role="radiogroup" aria-label="Round length"></div>
  <p class="mmt-blurb" id="mmt-blurb"></p>

  <div class="mmt-stage">
    <div class="mmt-clockwrap">
      <span class="mmt-clock" id="mmt-clock" role="timer" aria-live="off">3:00</span>
      <div class="mmt-bar"><i id="mmt-bar"></i></div>
    </div>

    <div class="mmt-field" id="mmt-field" hidden>
      <canvas id="mmt-canvas" aria-label="Arcade: move to shoot down pressure tactics, and let genuine offers land."></canvas>
      <div class="mmt-hud">
        <span id="mmt-score">0</span>
        <span id="mmt-missed" aria-label="Pressure tactics that got through">0 through</span>
      </div>
      <div class="mmt-over" id="mmt-over" hidden>
        <strong id="mmt-over-head">Round over</strong>
        <span id="mmt-over-body"></span>
        <button type="button" class="mmt-btn" id="mmt-again">Go again</button>
      </div>
    </div>
  </div>

  <div class="mmt-controls">
    <button type="button" class="mmt-btn primary" id="mmt-go">Start</button>
    <button type="button" class="mmt-btn" id="mmt-reset">Reset</button>
    <button type="button" class="mmt-btn quiet" id="mmt-sound" aria-pressed="true" title="End-of-round chime">🔔</button>
  </div>

  <p class="mmt-foot" id="mmt-foot"></p>
</section>

<style>
.mmt{--ink:#241F19;--cream:#FFFDF7;--paper:#F6EFE2;--rule:rgba(38,30,20,.12);
  --dim:#6B6154;--brand:#9C5122;--gold:#c9a84c;--red:#B0413E;--green:#2E7D32;
  max-width:560px;margin:0 auto;padding:18px 16px 20px;border-radius:16px;
  background:linear-gradient(180deg,#F6EFE2 0%,#EDE4D2 100%);color:var(--ink);
  border:1px solid rgba(251,191,36,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.mmt-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.mmt-lede{margin:4px 0 14px;font-size:12.5px;line-height:1.5;color:var(--dim)}

.mmt-modes{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:rgba(38,30,20,.07)}
.mmt-mode{appearance:none;border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:800;
  padding:6px 14px;border-radius:8px;color:var(--dim);background:transparent}
.mmt-mode.on{background:var(--cream);color:var(--ink);box-shadow:0 1px 3px rgba(90,74,50,.22)}

.mmt-presets{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mmt-preset{appearance:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:999px;color:var(--dim);background:var(--cream);
  border:1px solid var(--rule)}
.mmt-preset.on{background:var(--brand);border-color:var(--brand);color:#fff}
.mmt-blurb{margin:8px 0 0;font-size:11.5px;color:var(--dim);min-height:1.2em}

.mmt-stage{margin:14px 0 0}
.mmt-clockwrap{text-align:center}
.mmt-clock{display:block;font-size:clamp(46px,17vw,72px);font-weight:800;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mmt-clock.low{color:var(--red)}
.mmt-bar{height:5px;border-radius:999px;background:rgba(38,30,20,.12);overflow:hidden;margin:12px 0 0}
.mmt-bar > i{display:block;height:100%;width:100%;border-radius:999px;background:var(--brand)}
.mmt-bar.low > i{background:var(--red)}

.mmt-field{position:relative;margin:14px 0 0;border-radius:12px;overflow:hidden;
  background:#1B1712;border:1px solid rgba(38,30,20,.25)}
.mmt-field canvas{display:block;width:100%;height:auto;touch-action:none}
/* Blocks enter at the top edge, which is exactly where the score sits. Without
   a scrim a red block slides under the HUD and neither is readable. */
.mmt-field::before{content:'';position:absolute;inset:0 0 auto 0;height:42px;
  background:linear-gradient(180deg,rgba(27,23,18,.92) 0%,rgba(27,23,18,0) 100%);
  pointer-events:none;z-index:1}
.mmt-hud{position:absolute;inset:8px 10px auto 10px;display:flex;justify-content:space-between;
  font-size:13px;font-weight:800;color:#F6EFE2;text-shadow:0 1px 3px rgba(0,0,0,.7);
  pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
.mmt-over{z-index:3}
.mmt-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:16px;
  background:rgba(27,23,18,.88);color:#F6EFE2}
/* An author `display` beats the UA stylesheet's [hidden]{display:none}, so the
   end-of-round card sat over a live game until this rule was added. Blanket
   rather than targeted: the same trap is waiting for the next element here
   that gets both a display and a hidden attribute. */
.mmt [hidden]{display:none}
.mmt-over strong{font-size:19px}
.mmt-over span{font-size:13px;color:#c8bfae;max-width:32ch;line-height:1.5}

.mmt-controls{display:flex;gap:8px;margin:14px 0 0}
.mmt-btn{appearance:none;cursor:pointer;font:inherit;font-size:13px;font-weight:800;
  padding:11px 18px;border-radius:10px;border:1px solid var(--rule);
  background:var(--cream);color:var(--ink)}
.mmt-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;flex:1}
.mmt-btn.quiet{padding:11px 13px}
.mmt-btn[aria-pressed="false"]{opacity:.45}
.mmt-btn:disabled{opacity:.4;cursor:default}

.mmt-foot{margin:12px 0 0;font-size:11px;line-height:1.5;color:var(--dim);text-align:center}

@media(prefers-reduced-motion:reduce){.mmt-bar > i{transition:none}}
</style>

<script type="module">
// ────────────────────────────────────────────────────────────────────────
// GENERATED — do not edit. Source: mixmatch/web/timer-engine.js
// Regenerate with: npm run mixmatch:timer
// ────────────────────────────────────────────────────────────────────────
// Mix & Match — the Timer tab's engine.
//
// WHAT THIS IS
//
// A practice-round clock, and a small arcade game that runs on the same clock.
// One session object drives both, because they are the same thing from the
// user's side: you set a round length, you press start, the round ends when the
// clock says so. Whether you spent that round watching digits or shooting down
// pressure tactics is a mode flag.
//
// WHY IT IS PURE
//
// No DOM, no canvas, no timers of its own, no Date.now(). Every advance is
// `update(nowMs)` with the caller's clock, so a whole round can be replayed in
// a unit test in microseconds and the result is identical every time. The
// drawing and input live in timer-tab.html; this file decides what is true.
//
// WHY IT IS DETERMINISTIC
//
// Seeded RNG plus a fixed simulation step. Same seed and same input timeline
// gives the same score, which is what lets the tests assert real gameplay
// outcomes rather than "it did not throw".
//
// NO ASSETS
//
// Everything on screen is a rectangle, a circle, or a text label. There are no
// images, no sprite sheets and no audio files anywhere in this feature, which
// is the constraint that lets it ship on a static host with nothing to upload
// and nothing to cache-bust.
//
// Plain ESM, no dependencies. Imported by the browser and by node --test.

// ── round lengths ───────────────────────────────────────────────────────────

/**
 * The presets are the drills, not round numbers. Twelve minutes is the
 * three-stage session the site already promises ("if your team can run a
 * three-stage session in twelve minutes"), and a stage is four of those, so
 * the two are the same claim at different zoom levels.
 */
const ROUND_PRESETS = [
  { id: 'drill', label: '1 min', ms: 60_000, blurb: 'One tool, one rep.' },
  { id: 'stage', label: '3 min', ms: 180_000, blurb: 'One stage of a session.' },
  { id: 'round', label: '5 min', ms: 300_000, blurb: 'A full practice round.' },
  { id: 'session', label: '12 min', ms: 720_000, blurb: 'A three-stage session.' },
];

const DEFAULT_PRESET = 'stage';

function presetById(id) {
  const preset = ROUND_PRESETS.find((p) => p.id === id);
  if (!preset) throw new TypeError(`Unknown round preset: ${id}`);
  return preset;
}

// ── what falls ──────────────────────────────────────────────────────────────

/**
 * Pressure tactics. Shooting one is worth points.
 *
 * Kept to short strings on purpose: the label is drawn inside a block roughly
 * a sixth of the field wide, so anything longer than about twelve characters
 * stops being readable on a phone.
 */
const TACTICS = [
  'Lowball',
  'Nibble',
  'Deadline',
  'Bluff',
  'Good Cop',
  'Exploding',
  'Take It',
  'Flinch',
];

/**
 * Genuine offers. Shooting one costs you, letting it land pays.
 *
 * This is the whole game, and it is why firing is held rather than automatic.
 * An always-on gun would mean the only decision is where to stand, and you
 * would lose points to offers that happened to drift overhead while you were
 * chasing something else. Holding to fire makes *not responding* a move you
 * can actually play — which is the thing being practised. The hard part of a
 * negotiation is rarely having a rebuttal ready; it is noticing that the thing
 * in front of you does not need one.
 */
const OFFERS = ['Fair Offer', 'Good Faith', 'Real Ask', 'Straight Deal'];

const HIT_TACTIC = 10;
const LAND_OFFER = 25;

/**
 * The two mistakes cost the same, on purpose: answering something that did not
 * need answering, and failing to answer something that did.
 *
 * They also have to be this steep or the game has no game in it. Offers are a
 * quarter of what spawns, so standing still and touching nothing is worth
 * 0.25 x 25 + 0.75 x MISS per block. At -5 that is *positive* and doing
 * nothing beats playing; at -15 it is clearly negative, spraying at everything
 * comes out mildly positive, and actually choosing comes out far ahead. That
 * ordering is the whole design, and a test pins it.
 */
const HIT_OFFER = -15;
const MISS_TACTIC = -15;

// ── field geometry ──────────────────────────────────────────────────────────
//
// Normalised: x and y both run 0..1, y increasing downward. The renderer
// multiplies by whatever the canvas happens to be, so the same numbers are
// correct on a phone and on an iPad and nothing needs a second set of assets.

const FIELD = Object.freeze({
  tankY: 0.9,
  tankHalfWidth: 0.05,
  tankSpeed: 1.6, // field-widths per second
  shotSpeed: 1.15, // field-heights per second
  fireIntervalMs: 260,
  blockHalfWidth: 0.08,
  blockHeight: 0.075,
});

const STEP_MS = 1000 / 60;
/** Simulation steps one `update` may run. Caps the catch-up after a
 *  backgrounded tab so a returning player gets a dropped frame, not a wall of
 *  blocks that fell while they were not looking. */
const MAX_STEPS_PER_UPDATE = 10;

/** mulberry32 — 32 bits of state, uniform enough for spawn choices and small
 *  enough to read. The point is reproducibility, not cryptography. */
function makeRng(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Difficulty as a 0..1 ramp across the round. A twelve-minute session and a
 *  one-minute drill therefore both start gentle and both finish hard, instead
 *  of the long one being twelve minutes of the easy part. */
function ramp(session) {
  if (session.durationMs <= 0) return 1;
  return Math.min(1, session.elapsedMs / session.durationMs);
}

function spawnIntervalMs(session) {
  return 1600 - 750 * ramp(session);
}

/**
 * A hard ceiling on what is on screen at once.
 *
 * Not a difficulty knob — a legibility one. Every block carries a text label
 * roughly a sixth of the field wide, and past about seven of them the field
 * stops being a game and becomes a wall of words nobody can read on a phone.
 * The first tuning pass peaked at eleven.
 */
const MAX_BLOCKS = 7;

function fallSpeed(session, rng) {
  const base = 0.1 + 0.11 * ramp(session);
  return base * (0.85 + 0.3 * rng());
}

/**
 * A session: one round of the clock, optionally with a game attached.
 *
 * `mode` is 'timer' or 'arcade'. In timer mode nothing is simulated at all —
 * the clock is the entire feature, which is the mode a facilitator running a
 * live drill actually wants.
 */
function createSession({
  durationMs = presetById(DEFAULT_PRESET).ms,
  mode = 'timer',
  seed = 1,
} = {}) {
  if (!Number.isFinite(durationMs) || durationMs <= 0) {
    throw new TypeError(`durationMs must be a positive number, got ${durationMs}`);
  }
  if (mode !== 'timer' && mode !== 'arcade') {
    throw new TypeError(`mode must be 'timer' or 'arcade', got ${mode}`);
  }

  const session = {
    durationMs,
    mode,
    state: 'idle', // idle | running | paused | done
    elapsedMs: 0,
    lastNow: null,

    // game
    rng: makeRng(seed),
    tankX: 0.5,
    targetX: 0.5,
    firing: false,
    shots: [],
    blocks: [],
    score: 0,
    /** Pressure tactics that got past you. Costs score, never the round. */
    missed: 0,
    sinceSpawnMs: 0,
    sinceFireMs: 0,
    stepDebtMs: 0,
    /** Transient events since the last update, for the renderer to flash. */
    events: [],
  };

  return session;
}

function start(session, nowMs) {
  if (session.state === 'running') return session;
  session.state = 'running';
  session.lastNow = nowMs;
  return session;
}

function pause(session) {
  if (session.state === 'running') session.state = 'paused';
  return session;
}

function resume(session, nowMs) {
  if (session.state !== 'paused') return session;
  session.state = 'running';
  session.lastNow = nowMs;
  return session;
}

/** Back to idle with the clock full. Keeps `mode` and `durationMs`; everything
 *  else including the RNG stream is rebuilt, so a reset round is the same
 *  round. */
function reset(session, { durationMs = session.durationMs, mode = session.mode, seed = 1 } = {}) {
  const fresh = createSession({ durationMs, mode, seed });
  Object.assign(session, fresh);
  return session;
}

function remainingMs(session) {
  return Math.max(0, session.durationMs - session.elapsedMs);
}

/** Steer the tank. `x` is a field coordinate; the tank walks toward it at a
 *  finite speed rather than teleporting, which is what makes standing in the
 *  wrong place cost something. */
function aimAt(session, x) {
  session.targetX = clamp(x, FIELD.tankHalfWidth, 1 - FIELD.tankHalfWidth);
  return session;
}

/**
 * Hold the trigger, or let it go.
 *
 * Pressing fires at once rather than after the cooldown: a gun that ignores
 * the first press for a quarter of a second reads as a dropped input, and the
 * player blames the game rather than their aim.
 */
function setFiring(session, firing) {
  const next = Boolean(firing);
  if (next && !session.firing) session.sinceFireMs = FIELD.fireIntervalMs;
  session.firing = next;
  return session;
}

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/**
 * Advance to `nowMs`.
 *
 * The clock advances by real elapsed time, uncapped: a practice timer that
 * loses a minute because the tab was backgrounded is a broken timer. The
 * simulation advances in fixed steps and is capped, because a game that
 * fast-forwards thirty seconds of falling blocks the moment you switch back is
 * a broken game. Those two rules disagree on purpose, and only in the case
 * where the player was not watching.
 */
function update(session, nowMs) {
  if (session.state !== 'running') return session;

  const deltaMs = Math.max(0, nowMs - (session.lastNow ?? nowMs));
  session.lastNow = nowMs;
  session.events = [];

  const room = Math.max(0, session.durationMs - session.elapsedMs);
  const clockMs = Math.min(deltaMs, room);
  session.elapsedMs += clockMs;

  if (session.mode === 'arcade') {
    session.stepDebtMs = Math.min(
      session.stepDebtMs + clockMs,
      STEP_MS * MAX_STEPS_PER_UPDATE,
    );
    while (session.stepDebtMs >= STEP_MS) {
      session.stepDebtMs -= STEP_MS;
      step(session, STEP_MS);
    }
  }

  // The clock is the only thing that can end a round. There is deliberately no
  // lose condition: a facilitator running a twelve-minute drill cannot have the
  // arcade decide the drill is over at 0:47, which is exactly what three lives
  // did the first time this was played.
  if (remainingMs(session) === 0) {
    session.state = 'done';
    session.shots = [];
  }

  return session;
}

function step(session, dtMs) {
  const dt = dtMs / 1000;

  // tank
  const wanted = session.targetX - session.tankX;
  const travel = FIELD.tankSpeed * dt;
  session.tankX += Math.abs(wanted) <= travel ? wanted : Math.sign(wanted) * travel;

  // fire
  if (session.firing) {
    session.sinceFireMs += dtMs;
    if (session.sinceFireMs >= FIELD.fireIntervalMs) {
      session.sinceFireMs -= FIELD.fireIntervalMs;
      session.shots.push({ x: session.tankX, y: FIELD.tankY - 0.02 });
    }
  }

  // spawn
  session.sinceSpawnMs += dtMs;
  if (session.sinceSpawnMs >= spawnIntervalMs(session)) {
    session.sinceSpawnMs = 0;
    if (session.blocks.length < MAX_BLOCKS) spawn(session);
  }

  // shots rise
  for (const shot of session.shots) shot.y -= FIELD.shotSpeed * dt;
  session.shots = session.shots.filter((s) => s.y > -0.05);

  // blocks fall
  for (const block of session.blocks) block.y += block.speed * dt;

  resolveHits(session);
  resolveLandings(session);
}

function spawn(session) {
  const isOffer = session.rng() < 0.25;
  const pool = isOffer ? OFFERS : TACTICS;
  const label = pool[Math.floor(session.rng() * pool.length) % pool.length];
  const x = clamp(
    FIELD.blockHalfWidth + session.rng() * (1 - 2 * FIELD.blockHalfWidth),
    FIELD.blockHalfWidth,
    1 - FIELD.blockHalfWidth,
  );
  session.blocks.push({
    x,
    y: -FIELD.blockHeight,
    kind: isOffer ? 'offer' : 'tactic',
    label,
    speed: fallSpeed(session, session.rng),
  });
}

function resolveHits(session) {
  const survivingShots = [];
  outer: for (const shot of session.shots) {
    for (let i = 0; i < session.blocks.length; i++) {
      const block = session.blocks[i];
      const inX = Math.abs(shot.x - block.x) <= FIELD.blockHalfWidth;
      const inY = shot.y >= block.y && shot.y <= block.y + FIELD.blockHeight;
      if (!inX || !inY) continue;

      session.blocks.splice(i, 1);
      if (block.kind === 'tactic') {
        session.score += HIT_TACTIC;
        session.events.push({ type: 'hitTactic', x: block.x, y: block.y, points: HIT_TACTIC });
      } else {
        session.score += HIT_OFFER;
        session.events.push({ type: 'hitOffer', x: block.x, y: block.y, points: HIT_OFFER });
      }
      continue outer; // one shot, one block
    }
    survivingShots.push(shot);
  }
  session.shots = survivingShots;
}

function resolveLandings(session) {
  const stillFalling = [];
  for (const block of session.blocks) {
    if (block.y <= 1) {
      stillFalling.push(block);
      continue;
    }
    if (block.kind === 'offer') {
      session.score += LAND_OFFER;
      session.events.push({ type: 'landedOffer', x: block.x, points: LAND_OFFER });
    } else {
      session.score += MISS_TACTIC;
      session.missed += 1;
      session.events.push({ type: 'landedTactic', x: block.x, points: MISS_TACTIC });
    }
  }
  session.blocks = stillFalling;
}

// ── display ─────────────────────────────────────────────────────────────────

/** "3:00", "0:07". Minutes are not zero-padded; seconds always are. */
function formatClock(ms) {
  const total = Math.ceil(Math.max(0, ms) / 1000);
  const minutes = Math.floor(total / 60);
  const seconds = total % 60;
  return `${minutes}:${String(seconds).padStart(2, '0')}`;
}

/**
 * A read-only view for the renderer, so drawing code never reaches into the
 * session and mutates it by accident.
 */
function snapshot(session) {
  return {
    state: session.state,
    mode: session.mode,
    remainingMs: remainingMs(session),
    fractionLeft: session.durationMs ? remainingMs(session) / session.durationMs : 0,
    score: session.score,
    missed: session.missed,
    tankX: session.tankX,
    firing: session.firing,
    shots: session.shots.map((s) => ({ x: s.x, y: s.y })),
    blocks: session.blocks.map((b) => ({ x: b.x, y: b.y, kind: b.kind, label: b.label })),
    events: session.events.slice(),
  };
}


(function () {
  const root = document.getElementById('mmt-root');
  if (!root) return;
  const $ = (id) => document.getElementById(id);

  const STORE = 'mm.timer.v1';
  const el = {
    clock: $('mmt-clock'), bar: $('mmt-bar'), barWrap: $('mmt-bar').parentElement,
    presets: $('mmt-presets'), blurb: $('mmt-blurb'), field: $('mmt-field'),
    canvas: $('mmt-canvas'), score: $('mmt-score'), missed: $('mmt-missed'),
    over: $('mmt-over'), overHead: $('mmt-over-head'), overBody: $('mmt-over-body'),
    again: $('mmt-again'), go: $('mmt-go'), reset: $('mmt-reset'),
    sound: $('mmt-sound'), foot: $('mmt-foot'),
  };
  const ctx = el.canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const prefs = load();
  let mode = prefs.mode === 'arcade' ? 'arcade' : 'timer';
  let presetId = ROUND_PRESETS.some((p) => p.id === prefs.presetId) ? prefs.presetId : DEFAULT_PRESET;
  let soundOn = prefs.soundOn !== false;
  let session = createSession({ durationMs: presetById(presetId).ms, mode, seed: seed() });
  let raf = 0;
  let chimed = false;

  function seed() { return (Math.random() * 0xffffffff) >>> 0; }

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch { return {}; }
  }
  function save(patch) {
    try {
      localStorage.setItem(STORE, JSON.stringify({ ...load(), ...patch }));
    } catch { /* private browsing: preferences just do not persist */ }
  }

  // ── chrome ───────────────────────────────────────────────────────────────

  ROUND_PRESETS.forEach((preset) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mmt-preset';
    b.dataset.preset = preset.id;
    b.textContent = preset.label;
    b.setAttribute('role', 'radio');
    b.addEventListener('click', () => choosePreset(preset.id));
    el.presets.appendChild(b);
  });

  function choosePreset(id) {
    presetId = id;
    save({ presetId: id });
    rebuild();
  }

  function chooseMode(next) {
    mode = next;
    save({ mode: next });
    rebuild();
  }

  function rebuild() {
    session = createSession({ durationMs: presetById(presetId).ms, mode, seed: seed() });
    chimed = false;
    syncChrome();
    resize();
    draw();
  }

  function syncChrome() {
    root.querySelectorAll('.mmt-mode').forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', String(on));
    });
    root.querySelectorAll('.mmt-preset').forEach((b) => {
      const on = b.dataset.preset === presetId;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', String(on));
    });
    el.blurb.textContent = presetById(presetId).blurb;
    el.field.hidden = mode !== 'arcade';
    el.over.hidden = true;
    el.sound.setAttribute('aria-pressed', String(soundOn));
    el.foot.innerHTML = mode === 'arcade'
      ? 'Hold to fire. Shoot the pressure tactics — lift, and let the genuine offers land. Best: <b>' + best() + '</b>'
      : 'Free, no signup, no account. Nothing here spends tokens.';
    paintControls();
  }

  function paintControls() {
    const s = session.state;
    el.go.textContent = s === 'running' ? 'Pause' : s === 'paused' ? 'Resume' : s === 'done' ? 'Start' : 'Start';
    el.go.disabled = false;
  }

  // Best score, per round length. A single global best would let a 12-minute
  // score swamp every 1-minute drill forever, and "beat your best" only means
  // something against the same clock.
  function best() {
    return Number((load().bests || {})[presetId] || 0);
  }
  function recordBest(score) {
    if (score <= best()) return;
    save({ bests: { ...(load().bests || {}), [presetId]: score } });
  }

  // ── controls ─────────────────────────────────────────────────────────────

  root.querySelectorAll('.mmt-mode').forEach((b) =>
    b.addEventListener('click', () => chooseMode(b.dataset.mode)));

  el.go.addEventListener('click', () => {
    if (session.state === 'running') { pause(session); }
    else if (session.state === 'paused') { resume(session, performance.now()); }
    else {
      if (session.state === 'done') rebuild();
      start(session, performance.now());
      armChime();
    }
    paintControls();
    loop();
  });

  el.reset.addEventListener('click', rebuild);
  el.again.addEventListener('click', () => { rebuild(); start(session, performance.now()); armChime(); paintControls(); loop(); });

  el.sound.addEventListener('click', () => {
    soundOn = !soundOn;
    save({ soundOn });
    el.sound.setAttribute('aria-pressed', String(soundOn));
  });

  // Steering and firing are one gesture: your finger is where the tank goes,
  // and holding it down is the trigger. Lift to hold fire. That is the whole
  // control scheme, one finger, no second thumb anywhere near the screen.
  function steer(e) {
    const rect = el.canvas.getBoundingClientRect();
    if (!rect.width) return;
    aimAt(session, (e.clientX - rect.left) / rect.width);
  }
  el.canvas.addEventListener('pointerdown', (e) => {
    el.canvas.setPointerCapture(e.pointerId);
    steer(e);
    setFiring(session, true);
  });
  el.canvas.addEventListener('pointermove', steer);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) =>
    el.canvas.addEventListener(type, () => setFiring(session, false)));

  // Keyboard mirrors it exactly: arrows steer, space is the trigger. Held, not
  // tapped, so the same "stop shooting" move is available without a touchscreen.
  window.addEventListener('keydown', (e) => {
    if (mode !== 'arcade' || el.field.hidden) return;
    if (e.key === 'ArrowLeft') aimAt(session, session.tankX - 0.12);
    else if (e.key === 'ArrowRight') aimAt(session, session.tankX + 0.12);
    else if (e.key === ' ' || e.key === 'Spacebar') {
      // Space still has to activate a focused button, or the keyboard path
      // through Start/Reset breaks the moment the arcade is on screen.
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      setFiring(session, true);
    } else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Spacebar') setFiring(session, false);
  });
  window.addEventListener('blur', () => setFiring(session, false));

  // ── the end-of-round chime ───────────────────────────────────────────────
  // A short oscillator burst rather than an audio file: no asset to host, no
  // request to make, and nothing to fail on a flaky connection.
  let audio = null;
  function armChime() { chimed = false; if (soundOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; } } }
  function chime() {
    if (!soundOn || !audio || chimed) return;
    chimed = true;
    try {
      const t = audio.currentTime;
      [880, 660].forEach((hz, i) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, t + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.18, t + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.16);
        osc.connect(gain).connect(audio.destination);
        osc.start(t + i * 0.18);
        osc.stop(t + i * 0.18 + 0.2);
      });
    } catch { /* audio is a nicety; a round that ends silently still ended */ }
  }

  // ── canvas ───────────────────────────────────────────────────────────────

  function resize() {
    if (el.field.hidden) return;
    const cssWidth = el.canvas.clientWidth || el.field.clientWidth;
    if (!cssWidth) return;
    const cssHeight = Math.round(Math.min(360, Math.max(200, cssWidth * 0.72)));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    el.canvas.style.height = cssHeight + 'px';
    el.canvas.width = Math.round(cssWidth * dpr);
    el.canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { resize(); draw(); });

  // Transient feedback: every scoring event becomes a short-lived floating
  // number. The engine stays pure — it reports events, and remembering them
  // long enough to animate is the renderer's job, not the simulation's.
  const fx = [];
  const FX_MS = 700;

  function harvest(view, now) {
    view.events.forEach((e) => {
      const at = e.type === 'landedOffer' || e.type === 'landedTactic' ? 0.92 : (e.y ?? 0.5);
      // Clamped into the readable band. Blocks under sustained fire die in
      // their first seconds, high on the field — which put the popup at ~13px,
      // under the HUD scrim, where the first visual check couldn't see it.
      const y = Math.min(Math.max(at, 0.18), 0.86);
      fx.push({
        text: e.points > 0 ? '+' + e.points : e.points < 0 ? String(e.points) : '',
        color: e.points > 0 ? (e.type === 'landedOffer' ? '#6fcf7c' : '#e9c46a')
             : '#e07a76',
        x: e.x, y, bornAt: now,
      });
    });
    while (fx.length && now - fx[0].bornAt > FX_MS) fx.shift();
  }

  function draw(now = performance.now()) {
    if (el.field.hidden) return;
    const w = el.canvas.clientWidth;
    const h = el.canvas.clientHeight;
    if (!w || !h) return;
    const view = snapshot(session);
    harvest(view, now);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#1B1712';
    ctx.fillRect(0, 0, w, h);

    const groundY = (FIELD.tankY + 0.06) * h;
    ctx.strokeStyle = 'rgba(246,239,226,.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();

    const blockW = FIELD.blockHalfWidth * 2 * w;
    const blockH = FIELD.blockHeight * h;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.max(8, Math.min(12, blockW * 0.15)) + 'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
    view.blocks.forEach((b) => {
      const x = b.x * w - blockW / 2;
      const y = b.y * h;
      ctx.fillStyle = b.kind === 'offer' ? '#2E7D32' : '#B0413E';
      round(x, y, blockW, blockH, 5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      ctx.fillText(b.label, b.x * w, y + blockH / 2, blockW - 8);
    });

    ctx.fillStyle = '#c9a84c';
    view.shots.forEach((s) => ctx.fillRect(s.x * w - 1.5, s.y * h - 6, 3, 9));

    // The tank: a hull, a turret and a barrel. Three rectangles, no artwork,
    // which is the entire reason this ships on a static host.
    const tx = view.tankX * w;
    const ty = FIELD.tankY * h;
    const tw = FIELD.tankHalfWidth * 2 * w;
    ctx.fillStyle = view.firing ? '#c9a84c' : '#F6EFE2';
    round(tx - tw / 2, ty, tw, tw * 0.30, 3); ctx.fill();
    round(tx - tw * 0.22, ty - tw * 0.20, tw * 0.44, tw * 0.24, 2); ctx.fill();
    ctx.fillRect(tx - 2, ty - tw * 0.46, 4, tw * 0.28);

    // Floating score numbers: rise and fade over FX_MS. Skipped entirely for
    // reduced-motion users — the HUD score is the accessible channel.
    if (!reducedMotion.matches) {
      ctx.font = '800 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      fx.forEach((p) => {
        if (!p.text) return;
        const age = (now - p.bornAt) / FX_MS;
        if (age >= 1) return;
        ctx.globalAlpha = 1 - age;
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x * w, (p.y - age * 0.06) * h);
      });
      ctx.globalAlpha = 1;
    }

    if (view.state === 'idle') {
      ctx.fillStyle = 'rgba(246,239,226,.72)';
      ctx.font = '700 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      ctx.fillText('Hold anywhere to aim and fire', w / 2, h * 0.42);
      ctx.font = '600 11.5px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      ctx.fillStyle = 'rgba(246,239,226,.5)';
      ctx.fillText('Lift to hold fire. Green offers are meant to land.', w / 2, h * 0.42 + 19);
    }

    if (view.state === 'paused') {
      ctx.fillStyle = 'rgba(27,23,18,.55)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(246,239,226,.9)';
      ctx.font = '800 16px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
      ctx.fillText('Paused', w / 2, h * 0.45);
    }
  }

  function round(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  // ── the loop ─────────────────────────────────────────────────────────────

  function loop() {
    cancelAnimationFrame(raf);
    const frame = (now) => {
      update(session, now);
      paint();
      if (session.state === 'running') raf = requestAnimationFrame(frame);
      else finish();
    };
    raf = requestAnimationFrame(frame);
  }

  function paint() {
    const view = snapshot(session);
    el.clock.textContent = formatClock(view.remainingMs);
    const low = view.remainingMs <= 10_000 && view.remainingMs > 0;
    el.clock.classList.toggle('low', low);
    el.barWrap.classList.toggle('low', low);
    el.bar.style.width = (view.fractionLeft * 100).toFixed(2) + '%';
    el.score.textContent = String(view.score);
    el.missed.textContent = view.missed + ' through';
    draw();
  }

  function finish() {
    paintControls();
    if (session.state !== 'done') return;
    chime();
    el.clock.setAttribute('aria-live', 'polite');
    if (mode !== 'arcade') return;

    const score = session.score;
    recordBest(score);
    el.overHead.textContent = 'Round over';
    el.overBody.textContent =
      'Score ' + score + '. ' + session.missed + ' got through. Best ' + best() + '.';
    el.over.hidden = false;
    el.foot.innerHTML = 'Shoot the pressure tactics. Let the genuine offers land. Best: <b>' + best() + '</b>';
  }

  // ── the tab switcher's two hooks ─────────────────────────────────────────

  window.MMTimerTab = {
    onShow() { resize(); draw(); },
    onHide() { if (session.state === 'running') { pause(session); paintControls(); } },
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) window.MMTimerTab.onHide();
  });

  syncChrome();
  resize();
  paint();
})();
</script>
<!-- MM-TIMER-TAB:END -->
</div>
</body>
</html>
